name: Bug report
description: Report something that is broken or behaving unexpectedly in Harnu.
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out the form below.
        For **security** issues, do not use this form — follow [SECURITY.md](https://github.com/junielton/harnu/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
      placeholder: When I click "new session", the terminal opens but no shell prompt appears...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, ordered steps so we can see it too.
      placeholder: |
        1. Open Harnu
        2. Click '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Harnu version
      description: See Settings → About (or the AppImage/.deb/.dmg filename).
      placeholder: v0.2.5
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os-details
    attributes:
      label: OS version / desktop environment
      placeholder: Ubuntu 24.04 / KDE Plasma (Wayland)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Paste any error output or attach screenshots. Logs are automatically formatted as code.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I am on the latest released version (or noted my version above).
          required: true
