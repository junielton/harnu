schema_version: '1.1'
context:
  scaffold_script: setup.sh
name: plan-overview
tags: [summarize]
execution:
  prompt: Summarize docs/specs/2026-08-22-daily-budget-plan.md for me. List its tasks in order with one line each on what the task delivers.
  max_turns: 12
  allowed_tools: [Read, Glob, Grep, Agent]
graders:
  - type: regex
    name: task-math
    pattern: 'budget math'
    flags: i
    match: contains
  - type: regex
    name: task-store
    pattern: 'budget store'
    flags: i
    match: contains
  - type: regex
    name: task-working-days
    pattern: 'working[- ]day'
    flags: i
    match: contains
  - type: regex
    name: task-alert
    pattern: 'threshold alert|80.{0,20}100'
    flags: i
    match: contains
  - type: llm
    name: complete-and-ordered
    criteria: The answer lists seven tasks in this order - pure budget math; working-day preference and baseline IPC; budget store; the row (design.md, i18n, component); working-days setting; threshold alert; repo contracts and full gate. Pass if all seven appear in this order, paraphrased is fine. Fail if any is missing or invented.
  - type: tool_used
    name: routed-to-doc-reader
    tool: Agent
    min: 1
    arm: with-only
